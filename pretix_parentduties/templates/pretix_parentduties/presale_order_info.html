{% load i18n %}
<div class="panel panel-primary">
    <div class="panel-heading">
        <h3 class="panel-title">{{ title }}</h3>
    </div>
    <div class="panel-body">
        <ul class="list-unstyled">
            {% for s in signups %}
                <li><strong>{{ s.text }}</strong> <span class="text-muted">({{ s.status_text }})</span></li>
            {% endfor %}
        </ul>
    </div>
</div>
